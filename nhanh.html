async function vsRunDetect(){
  if(!vsVideoFile){ showToast('Chưa chọn video'); return; }
  const doOcr = vsModeOcr.checked;
  const doAudio = vsModeAudio.checked;
  if(!doOcr && !doAudio){ showToast('Chọn ít nhất 1 nguồn cần dịch'); return; }
  const langs = [];
  if(vsLangZh.checked) langs.push('chi_sim');
  if(vsLangEn.checked) langs.push('eng');
  if(doOcr && langs.length === 0){ showToast('Chọn ít nhất 1 ngôn ngữ cho chữ trên hình'); return; }
  const interval = Math.max(0.5, parseFloat(vsInterval.value) || 2);
  vsBtnDetect.disabled = true;
  vsCuesWrap.style.display = 'none';
  vsResultWrap.style.display = 'none';
  try{
    await vsWaitMeta(vsVideoPlayer);
    const duration = vsVideoPlayer.duration;
    if(!duration || !isFinite(duration)){
      showToast('Không đọc được thời lượng video');
      return;
    }
    let ocrCues = [];
    let audioCues = [];
    if(doOcr){
      ocrCues = await vsDetectOcr(duration, langs, interval);
    }
    if(doAudio){
      audioCues = await vsDetectAudioSpeech();
    }
    let allCues = [...ocrCues, ...audioCues].sort((a,b)=> a.start - b.start);
    if(allCues.length === 0){
      vsSetStatus('Không tìm thấy chữ hoặc giọng nói nào. Thử đổi tuỳ chọn hoặc video khác.');
      return;
    }
    // Giới hạn tổng số câu để việc dịch + ghép phụ đề không quá nặng cho điện thoại
    allCues = allCues.slice(0, 60);
    vsSetStatus(`Tìm thấy ${allCues.length} đoạn. Đang dịch sang tiếng Việt...`);
    try{
      const translations = await vsTranslateCues(allCues);
      allCues.forEach((c,i)=>{ c.translated = translations[i] || '; });
      vsSetStatus(`Hoàn tất! ${allCues.length} đoạn phụ đề đã dịch — kiểm tra/sửa lại bên dưới rồi ghép vào video.`);
    }catch(err){
      console.error(err);
      allCues.forEach(c=>{ c.translated = '; });
      vsSetStatus(`Nhận diện xong ${allCues.length} đoạn, nhưng dịch tự động thất bại — hãy tự nhập tiếng Việt cho từng đoạn bên dưới.`);
    }
    vsCues = allCues;
    vsRenderCues();
    vsCuesWrap.style.display = 'block';
  }catch(err){
    console.error(err);
    showToast('Nhận diện thất bại, thử lại với video ngắn hơn hoặc bỏ bớt tuỳ chọn.');
  }finally{
    vsBtnDetect.disabled = false;
  }
}
async function vsTranslateCues(cues){
  const list = cues.map((c,i)=> `${i+1}. ${c.text}`).join('\n');
  const prompt = `Đây là các đoạn chữ trích xuất từ video (có thể tiếng Trung hoặc tiếng Anh, có thể lẫn lỗi do nhận diện tự động). Hãy dịch từng đoạn sang tiếng Việt tự nhiên, ngắn gọn, phù hợp làm phụ đề video. Chỉ trả lời bằng một mảng JSON các chuỗi tiếng Việt, đúng thứ tự, không thêm chú thích hay markdown:\n\n${list}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || ').join(').trim();
  const clean = text.replace(/^```json/i,').replace(/^```/,').replace(/```$/,').trim();
  const arr = JSON.parse(clean);
  if(!Array.isArray(arr)) throw new Error('Kết quả dịch không hợp lệ');
  return arr;
}
function vsRenderCues(){
  vsCuesList.innerHTML = vsCues.map((c,i)=> `
    <div class="cue-card">
      <div class="cue-time">${vsFmtTime(c.start)} – ${vsFmtTime(c.end)} <span style="color:var(--muted);font-weight:600">· ${c.source === 'audio' ? 'giọng nói' : 'chữ trên hình'}</span></div>
      <div class="cue-orig"><b>Gốc:</b> ${escapeHtml(c.text)}</div>
      <textarea data-i="${i}" class="cue-input" placeholder="Nhập bản dịch tiếng Việt...">${escapeHtml(c.translated || ')}</textarea>
    </div>
  `).join(');
  vsCuesList.querySelectorAll('.cue-input').forEach(ta=>{
    ta.addEventListener('input', (e)=>{
      const i = Number(e.target.dataset.i);
      vsCues[i].translated = e.target.value;
    });
  });
}
vsBtnDetect.addEventListener('click', vsRunDetect);
// Xuất file .srt dự phòng — dùng được ngay trong CapCut hoặc trình dựng video khác
function vsToSrtTime(t){
  const h = Math.floor(t/3600);
  const m = Math.floor((t%3600)/60);
  const s = Math.floor(t%60);
  const ms = Math.round((t - Math.floor(t)) * 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
}
function vsBuildSrt(){
  return vsCues.map((c,i)=> `${i+1}\n${vsToSrtTime(c.start)} --> ${vsToSrtTime(c.end)}\n${c.translated || c.text}\n`).join('\n');
}
vsBtnSrt.addEventListener('click', ()=>{
  if(vsCues.length === 0){ showToast('Chưa có phụ đề'); return; }
  const blob = new Blob([vsBuildSrt()], { type:'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vietsub.srt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  showToast('Đã tải file .srt');
});
// Ghép phụ đề đè lên video bằng ffmpeg.wasm, xuất .mp4
let vsFFmpeg = null;
function vsEscapeDrawtext(text){
  return text
    .replace(/\\/g, '\\\\\\\\')
    .replace(/:/g, '\\:')
    .replace(/'/g, "\u2019")
    .replace(/%/g, '\\%')
    .replace(/\n/g, ' ');
}
async function vsEnsureFFmpeg(){
  if(vsFFmpeg) return vsFFmpeg;
  const { FFmpeg } = FFmpegWASM;
  const { toBlobURL } = FFmpegUtil;
  const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  const ff = new FFmpeg();
  ff.on('log', ({ message }) => vsSetStatus(message.slice(0, 90)));
  await ff.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  vsFFmpeg = ff;
  return ff;
}
vsBtnBurn.addEventListener('click', async ()=>{
  if(!vsVideoFile || vsCues.length === 0){ showToast('Chưa có video hoặc phụ đề'); return; }
  const drawtexts = vsCues
    .filter(c => (c.translated || ').trim())
    .map(c => {
      const t = vsEscapeDrawtext(c.translated.trim());
      return `drawtext=fontfile=font.ttf:text='${t}':fontcolor=white:fontsize=h/18:borderw=3:bordercolor=black:x=(w-text_w)/2:y=h-h/8:enable='between(t,${c.start.toFixed(2)},${c.end.toFixed(2)})'`;
    });
  if(drawtexts.length === 0){ showToast('Chưa có nội dung tiếng Việt để ghép vào video'); return; }
  vsBtnBurn.disabled = true;
  try{
    vsSetStatus('Đang tải bộ xử lý video (lần đầu sẽ hơi lâu, ~vài chục MB)...');
    const ff = await vsEnsureFFmpeg();
    vsSetStatus('Đang nạp video vào bộ xử lý...');
    await vsWriteInputIfNeeded(ff);
    vsSetStatus('Đang tải font tiếng Việt (có dấu)...');
    const fontResp = await fetch('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts/hinted/ttf/NotoSans/NotoSans-Bold.ttf');
    const fontBuf = new Uint8Array(await fontResp.arrayBuffer());
    await ff.writeFile('font.ttf', fontBuf);
    const filter = drawtexts.join(',');
    vsSetStatus('Đang ghép phụ đề vào video — có thể mất vài phút tuỳ độ dài video...');
    await ff.exec(['-i', 'input.mp4', '-vf', filter, '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-c:a', 'copy', 'output.mp4']);
    vsSetStatus('Đang xuất file...');
    const data = await ff.readFile('output.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    vsResultPlayer.src = url;
    vsDownloadLink.href = url;
    vsResultWrap.style.display = 'block';
    vsSetStatus('Hoàn tất! Xem trước và tải video bên dưới.');
    showToast('Đã ghép phụ đề xong');
  }catch(err){
    console.error(err);
    vsSetStatus('Ghép phụ đề thất bại: ' + (err && err.message ? err.message : 'lỗi không xác định'));
    showToast('Thất bại — thử video ngắn hơn, hoặc dùng file .srt dự phòng ở trên.');
  }finally{
    vsBtnBurn.disabled = false;
  }
});
